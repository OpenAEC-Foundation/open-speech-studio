name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: all
        options: [all, windows, linux, macos]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Pre-flight check ───────────────────────────────────
  # Fail fast before we burn 3h of multi-platform build time on code
  # that doesn't even compile.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run build

  # ── 1b. Build matrix ──────────────────────────────────────
  # Tag pushes build everything; a manual run can pick one platform.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          all='[
            {"group":"windows","platform":"windows-latest","rust-target":"x86_64-pc-windows-msvc","label":"Windows"},
            {"group":"linux","platform":"ubuntu-22.04","rust-target":"x86_64-unknown-linux-gnu","label":"Linux","args":"--verbose --bundles deb,rpm,appimage"},
            {"group":"macos","platform":"macos-latest","rust-target":"aarch64-apple-darwin","label":"macOS-ARM","args":"--bundles app,dmg","whisper-arch":"arm64","whisper-metal":"ON"},
            {"group":"macos","platform":"macos-15-intel","rust-target":"x86_64-apple-darwin","label":"macOS-Intel","args":"--bundles app,dmg","whisper-arch":"x86_64","whisper-metal":"OFF"}
          ]'
          if [ "$PLATFORMS" = "all" ]; then
            include=$(jq -c . <<<"$all")
          else
            include=$(jq -c --arg p "$PLATFORMS" '[.[] | select(.group == $p)]' <<<"$all")
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  # ── 2. Build installers ───────────────────────────────────
  build:
    needs: [check, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    name: Build – ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libasound2-dev \
            libxdo-dev \
            patchelf \
            cmake

      - name: Install npm dependencies
        run: npm ci

      - name: Create bin directory
        shell: bash
        run: mkdir -p bin

      # Linux/macOS: one self-contained whisper-cli per target, named with the
      # target triple so Tauri bundles it as a sidecar next to the app binary
      # (see src-tauri/tauri.linux.conf.json and tauri.macos.conf.json). On
      # macOS it is signed along with the app.
      - name: Cache whisper.cpp binary
        if: runner.os != 'Windows'
        id: whisper-cache
        uses: actions/cache@v5
        with:
          path: bin/whisper-cli-${{ matrix.rust-target }}
          key: whisper-v1.8.3-static-${{ matrix.rust-target }}

      - name: Build whisper.cpp (Linux/macOS)
        if: runner.os != 'Windows' && steps.whisper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            platform_flags="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.whisper-arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DGGML_METAL=${{ matrix.whisper-metal }} -DGGML_METAL_EMBED_LIBRARY=ON"
          else
            platform_flags="-DGGML_OPENMP=OFF"
          fi
          git clone --depth 1 --branch v1.8.3 https://github.com/ggml-org/whisper.cpp.git _whisper_build
          # GGML_NATIVE=OFF: do not tune for the CI runner's CPU.
          cmake -S _whisper_build -B _whisper_build/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            $platform_flags
          cmake --build _whisper_build/build --config Release -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) --target whisper-cli
          cp _whisper_build/build/bin/whisper-cli bin/whisper-cli-${{ matrix.rust-target }}
          chmod +x bin/whisper-cli-${{ matrix.rust-target }}
          rm -rf _whisper_build

      # With a Developer ID certificate in the repository secrets the app is
      # signed and (if the notarization secrets are there too) notarized.
      # Without them it is ad-hoc signed, which Apple Silicon needs to run it
      # at all, but Gatekeeper will still warn on first launch.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            echo "Signing with Developer ID certificate"
            echo "APPLE_CERTIFICATE=$CERT" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            if [ -n "$IDENTITY" ]; then
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            fi
            if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
              echo "Notarization enabled"
              echo "APPLE_ID=$NOTARY_ID" >> "$GITHUB_ENV"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM" >> "$GITHUB_ENV"
            else
              echo "::warning::Notarization secrets missing - app is signed but not notarized"
            fi
          else
            echo "::warning::No Apple certificate configured - using ad-hoc signature"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust-target }} ${{ matrix.args || '' }}

      # ── Verify macOS bundle ────────────────────────────────
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          echo "Bundle: $APP"
          ls -la "$APP/Contents/MacOS" "$APP/Contents/Resources/models"
          WHISPER="$APP/Contents/MacOS/whisper-cli"
          lipo -archs "$WHISPER" | grep -qx "${{ matrix.whisper-arch }}"
          otool -L "$WHISPER"
          if otool -L "$WHISPER" | grep -q '@rpath'; then
            echo "::error::whisper-cli depends on libraries that are not in the bundle"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP"
          curl -fsSL -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          "$WHISPER" -ng -m "$APP/Contents/Resources/models/ggml-small.bin" -f "$RUNNER_TEMP/jfk.wav" -nt | tee "$RUNNER_TEMP/out.txt"
          grep -qi "ask not" "$RUNNER_TEMP/out.txt"

      # ── Verify Linux packages ──────────────────────────────
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          ls -la "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm "$BUNDLE"/appimage/*.AppImage
          dpkg-deb -x "$BUNDLE"/deb/*.deb "$RUNNER_TEMP/deb"
          WHISPER="$RUNNER_TEMP/deb/usr/bin/whisper-cli"
          MODEL=$(find "$RUNNER_TEMP/deb/usr/lib" -name ggml-small.bin | head -1)
          echo "Model: $MODEL"
          # The app looks for the model relative to its own binary.
          test "$(dirname "$(dirname "$(dirname "$MODEL")")")" = "$RUNNER_TEMP/deb/usr/lib"
          if find "$RUNNER_TEMP/deb" -iname '*.dll' -o -iname '*.exe' | grep -q .; then
            echo "::error::Windows binaries ended up in the Linux package"
            exit 1
          fi
          ldd "$WHISPER"
          if ldd "$WHISPER" | grep -q 'not found'; then
            echo "::error::whisper-cli depends on libraries that are not on a stock system"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          "$WHISPER" -ng -m "$MODEL" -f "$RUNNER_TEMP/jfk.wav" -nt | tee "$RUNNER_TEMP/out.txt"
          grep -qi "ask not" "$RUNNER_TEMP/out.txt"

      # ── Sign Windows binaries ──────────────────────────────
      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: src-tauri/target/${{ matrix.rust-target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Windows installers
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Windows MSI
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: src-tauri/target/${{ matrix.rust-target }}/release/bundle/msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── Upload artifacts ───────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: open-speech-studio-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/rpm/*.rpm
          if-no-files-found: ignore
          retention-days: 14

  # ── 3. Publish draft release ──────────────────────────────
  # Creates a DRAFT so the operator can review/edit notes before going
  # public. Only runs for tag pushes, not manual dispatch.
  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect installer files
        run: |
          mkdir -p release
          find artifacts -name '*-setup.exe' -exec cp {} release/ \;
          find artifacts -name '*.msi' -exec cp {} release/ \;
          find artifacts -name '*.dmg' -exec cp {} release/ \;
          find artifacts -name '*.AppImage' -exec cp {} release/ \;
          find artifacts -name '*.deb' -exec cp {} release/ \;
          find artifacts -name '*.rpm' -exec cp {} release/ \;
          ls -la release/

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Open Speech Studio ${{ github.ref_name }}
          prerelease: false
          draft: true
          generate_release_notes: true
          body: |
            **Downloads:**
            - **Windows:** `.exe` (NSIS installer) / `.msi`
            - **Linux:** `.AppImage` / `.deb` / `.rpm`
            - **macOS:** `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel)
          files: release/*
