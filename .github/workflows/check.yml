name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit

  native:
    name: Native – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev libasound2-dev libxdo-dev libxtst-dev
      - run: npm ci
      - run: npm run build
      - name: Build and test Windows CPU backend without bundled CUDA DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-whisper-cpu.ps1
      - name: Build Linux sidecar required by the Tauri resource checks
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch v1.8.3 https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper"
          cmake -S "$RUNNER_TEMP/whisper" -B "$RUNNER_TEMP/whisper/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build "$RUNNER_TEMP/whisper/build" --parallel 4 --target whisper-cli
          cp "$RUNNER_TEMP/whisper/build/bin/whisper-cli" bin/whisper-cli-x86_64-unknown-linux-gnu
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
